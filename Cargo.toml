[package]
name = "llm-providers-connector"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Sync client for OpenAI-compatible LLM endpoints: streaming chat with tools, model listing and probing, prices, API keys sealed at rest."
repository = "https://github.com/ikarys/llm-providers-connector"
readme = "README.md"
keywords = ["llm", "openai", "client"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
chacha20poly1305 = "0.10"
